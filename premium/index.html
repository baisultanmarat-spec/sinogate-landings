<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SINOGATE GROUP LIMITED — международная логистика</title>
<meta name="description" content="SINOGATE GROUP LIMITED — международная логистика между Китаем, Казахстаном и Центральной Азией: автомобильные, железнодорожные, мультимодальные и проектные перевозки.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;600;700&family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=Noto+Sans+SC:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --navy-950:#060d1d;--navy-900:#0a1428;--navy-800:#0f1d38;--navy-700:#172a4d;
  --gold:#c9a063;--gold-light:#e6c891;--gold-dark:#9c7640;
  --text:#e9edf5;--muted:#93a0b8;--line:rgba(201,160,99,.22);
  color-scheme:dark;
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{font-family:Montserrat,"Noto Sans SC",system-ui,sans-serif;background:var(--navy-950);color:var(--text);line-height:1.6;overflow-x:hidden}
html[lang=zh] body{font-family:"Noto Sans SC",Montserrat,system-ui,sans-serif}
html[lang=zh] .serif{font-family:"Noto Sans SC",sans-serif;font-style:normal;font-weight:500}
a{color:inherit;text-decoration:none}
img{max-width:100%;display:block}
.wrap{max-width:1200px;margin:0 auto;padding:0 24px}
.gold{color:var(--gold)}
.eyebrow{font-size:12px;letter-spacing:.32em;text-transform:uppercase;color:var(--gold);font-weight:600}
h1,h2,h3{font-weight:500;line-height:1.15;text-wrap:balance}
h2{font-size:clamp(30px,4vw,46px);margin:14px 0 18px}
.serif{font-family:"Cormorant Garamond",serif;font-style:italic;font-weight:500}
.muted{color:var(--muted)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:10px;padding:16px 30px;font-size:13px;letter-spacing:.14em;text-transform:uppercase;font-weight:600;border-radius:2px;transition:.25s;cursor:pointer;border:0;font-family:inherit}
.btn-gold{background:linear-gradient(135deg,var(--gold-light),var(--gold) 50%,var(--gold-dark));color:var(--navy-950)}
.btn-gold:hover{filter:brightness(1.1);transform:translateY(-1px)}
.btn-line{border:1px solid var(--line);color:var(--text);background:transparent}
.btn-line:hover{border-color:var(--gold);color:var(--gold)}
.btn svg{width:18px;height:18px;flex:none}

header{position:fixed;inset:0 0 auto;z-index:50;transition:.3s}
header.scrolled{background:rgba(6,13,29,.92);backdrop-filter:blur(12px);border-bottom:1px solid var(--line)}
.nav{display:flex;align-items:center;justify-content:space-between;height:84px;gap:20px}
.brand{display:flex;align-items:center;gap:14px;flex:none}
.brand img{height:40px}
.brand .sep{width:1px;height:34px;background:var(--gold);opacity:.6}
.brand b{display:block;font-weight:500;letter-spacing:.2em;font-size:17px;line-height:1.3}
.brand small{display:block;color:var(--gold);letter-spacing:.32em;font-size:9.5px}
.menu{display:flex;gap:30px;font-size:13px;letter-spacing:.06em;color:var(--muted)}
.menu a:hover{color:var(--gold)}
.nav-cta{display:flex;align-items:center;gap:18px}
.langs{display:flex;border:1px solid var(--line);border-radius:2px}
.langs button{background:none;border:0;color:var(--muted);font:600 12px Montserrat,"Noto Sans SC",sans-serif;letter-spacing:.08em;padding:8px 11px;cursor:pointer}
.langs button.on{background:var(--gold);color:var(--navy-950)}
.burger{display:none;background:none;border:0;color:var(--text);font-size:26px;cursor:pointer}

.hero{position:relative;min-height:min(100vh,1000px);display:flex;align-items:center;padding:150px 0 330px;overflow:hidden;
  background:radial-gradient(ellipse at 70% 0%,#1b2f58 0%,transparent 55%),var(--navy-950)}
.hero .globe-cv{position:absolute;left:0;right:0;bottom:0;width:100%;height:360px;display:block;
  -webkit-mask:linear-gradient(to top,#000 75%,transparent);mask:linear-gradient(to top,#000 75%,transparent)}
.hero .wrap{position:relative;z-index:2;width:100%}
.hero h1{font-size:clamp(36px,5.6vw,74px);letter-spacing:-.01em;max-width:960px;margin:22px 0 26px}
.hero p.lead{max-width:640px;color:#b7c1d4;font-size:18px;text-shadow:0 2px 12px rgba(6,13,29,.9)}
.hero .actions{display:flex;flex-wrap:wrap;gap:16px;margin-top:40px}
.tagline{position:absolute;z-index:2;bottom:36px;left:0;right:0;text-align:center;font-size:12px;letter-spacing:.5em;color:var(--text);opacity:.9;text-transform:uppercase;padding:0 16px;text-shadow:0 1px 8px #060d1d,0 0 2px #060d1d}

.facts{border-top:1px solid var(--line);border-bottom:1px solid var(--line);background:var(--navy-900)}
.facts .wrap{display:grid;grid-template-columns:repeat(4,1fr)}
.fact{padding:36px 24px;border-right:1px solid var(--line)}
.fact:last-child{border-right:0}
.fact b{display:block;font-family:"Cormorant Garamond",serif;font-size:30px;font-weight:500;color:var(--gold-light);line-height:1.1;margin-bottom:6px}
html[lang=zh] .fact b{font-family:"Noto Sans SC",sans-serif;font-size:24px}
.fact span{color:var(--muted);font-size:13px;letter-spacing:.04em}

section{padding:120px 0}
.head{display:grid;grid-template-columns:1fr 1fr;gap:60px;align-items:end;margin-bottom:64px}
.head p{color:var(--muted)}
.head.solo{grid-template-columns:1fr;margin-bottom:48px}

.about-grid{display:grid;grid-template-columns:1fr 1.1fr;gap:80px;align-items:center}
.about-grid p{color:var(--muted);font-size:16.5px}
.about-grid .quote{font-family:"Cormorant Garamond",serif;font-style:italic;font-size:32px;line-height:1.35;color:var(--gold-light);border-left:2px solid var(--gold);padding-left:28px}
html[lang=zh] .about-grid .quote{font-family:"Noto Sans SC",sans-serif;font-style:normal;font-size:24px}
.quote small{display:block;font-family:Montserrat,sans-serif;font-style:normal;font-size:12px;letter-spacing:.3em;text-transform:uppercase;color:var(--gold);margin-bottom:14px}

.services{display:grid;grid-template-columns:repeat(3,1fr);gap:1px;background:var(--line);border:1px solid var(--line)}
.svc{background:var(--navy-950);padding:44px 36px;transition:.35s}
.svc:hover{background:var(--navy-800)}
.svc .num{font-family:"Cormorant Garamond",serif;color:var(--gold);font-size:20px}
.svc svg{width:44px;height:44px;stroke:var(--gold);fill:none;stroke-width:1.3;margin:22px 0;stroke-linejoin:round;stroke-linecap:round}
.svc h3{font-size:21px;margin-bottom:12px}
.svc p{color:var(--muted);font-size:14.5px}

.corridor{background:linear-gradient(180deg,var(--navy-900),var(--navy-950))}
.corridor-grid{display:grid;grid-template-columns:1.1fr 1fr;gap:80px;align-items:center}
.corridor-grid > div > p{color:var(--muted);font-size:16.5px}
.route-card{border:1px solid var(--line);padding:40px;background:rgba(15,29,56,.6);position:relative}
.route{display:grid;margin-top:24px}
.stop{display:grid;grid-template-columns:22px 1fr;gap:18px;align-items:start;position:relative;padding-bottom:26px}
.stop:last-child{padding-bottom:0}
.stop:not(:last-child)::after{content:"";position:absolute;left:10px;top:22px;bottom:0;width:1px;background:repeating-linear-gradient(to bottom,var(--gold) 0 4px,transparent 4px 9px)}
.dot{width:21px;height:21px;border-radius:50%;border:1px solid var(--gold);display:grid;place-items:center}
.dot::after{content:"";width:7px;height:7px;border-radius:50%;background:var(--gold)}
.stop b{display:block;font-weight:600}
.stop span{color:var(--muted);font-size:13.5px}

.why{display:grid;grid-template-columns:repeat(4,1fr);gap:24px}
.why-item{border-top:1px solid var(--gold);padding-top:26px}
.why-item svg{width:34px;height:34px;stroke:var(--gold);fill:none;stroke-width:1.4;stroke-linejoin:round;stroke-linecap:round;margin-bottom:18px}
.why-item h4{font-size:18px;font-weight:600;margin-bottom:8px}
.why-item p{color:var(--muted);font-size:14.5px}

.steps{display:grid;grid-template-columns:repeat(5,1fr);gap:24px;counter-reset:s}
.step{border-top:1px solid var(--line);padding-top:24px;counter-increment:s}
.step::before{content:"0" counter(s);font-family:"Cormorant Garamond",serif;color:var(--gold);font-size:34px;display:block;margin-bottom:10px;line-height:1}
.step h4{font-size:16px;font-weight:600}

.contact{background:var(--navy-900);border-top:1px solid var(--line)}
.contact-grid{display:grid;grid-template-columns:1fr 1fr;gap:80px}
.contact-grid > div > p{color:var(--muted)}
.offices{display:grid;gap:26px;margin-top:36px}
.office h4{font-size:12px;letter-spacing:.3em;color:var(--gold);text-transform:uppercase;margin-bottom:6px;font-weight:600}
.office .big{display:block;font-size:24px;font-weight:500}
.office p{color:var(--muted);font-size:14px}
.contact .btn-wa{margin-top:34px}
form{border:1px solid var(--line);padding:44px;background:var(--navy-950)}
form h3{font-size:24px;margin-bottom:8px}
form > p{color:var(--muted);font-size:14px;margin-bottom:26px}
.field{margin-bottom:18px}
.field label{display:block;font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:var(--muted);margin-bottom:8px}
.field input,.field textarea{width:100%;background:transparent;border:0;border-bottom:1px solid var(--line);color:var(--text);font:inherit;padding:10px 0;outline:none;resize:vertical}
.field input:focus,.field textarea:focus{border-color:var(--gold)}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:20px}
form .btn{width:100%;margin-top:14px}
.form-note{color:var(--muted);font-size:12.5px;margin-top:14px}

footer{padding:40px 0;border-top:1px solid var(--line);color:var(--muted);font-size:13px}
footer .wrap{display:flex;justify-content:space-between;gap:20px;flex-wrap:wrap}

@media (max-width:1100px){.menu{gap:20px}}
@media (max-width:980px){
  .menu{display:none}.burger{display:block}
  .menu.open{display:flex;flex-direction:column;position:absolute;top:84px;left:0;right:0;background:var(--navy-950);padding:24px;border-bottom:1px solid var(--line);gap:18px}
  .head,.about-grid,.corridor-grid,.contact-grid{grid-template-columns:1fr;gap:40px}
  .services{grid-template-columns:1fr 1fr}
  .facts .wrap,.why{grid-template-columns:1fr 1fr}
  .fact:nth-child(2){border-right:0}.fact:nth-child(-n+2){border-bottom:1px solid var(--line)}
  .why{row-gap:40px}
  .steps{grid-template-columns:1fr 1fr}
  section{padding:80px 0}
}
@media (max-width:600px){
  .wrap{padding:0 16px}
  .nav{height:72px;gap:10px}
  .menu.open{top:72px}
  .brand{gap:10px}.brand img{height:32px}.brand .sep{display:none}
  .brand b{font-size:14px;letter-spacing:.14em}.brand small{font-size:8px;letter-spacing:.2em}
  .nav-cta{gap:8px}.nav-cta .btn{display:none}
  .langs button{padding:7px 8px;font-size:11px}
  .services,.steps,.row2,.why{grid-template-columns:1fr}
  .facts .wrap{grid-template-columns:1fr 1fr}
  .fact{padding:22px 12px}.fact b{font-size:22px}.fact span{font-size:12px}
  form{padding:28px 20px}
  .route-card{padding:28px 20px}
  .about-grid .quote{font-size:25px;padding-left:20px}
  .tagline{letter-spacing:.12em;font-size:9px;bottom:22px}
  .hero{padding:120px 0 250px}
  .hero p.lead{font-size:16px}
  .hero .globe-cv{height:260px}
  .hero .actions .btn{flex:1 1 100%}
  .office .big{font-size:21px}
}
</style>
</head>

    c.fillStyle=halo;c.beginPath();c.arc(cx,cy,R*1.12,0,Math.PI*2);c.fill();

    sea.addColorStop(0,'#1d3768');sea.addColorStop(0.8,'#132a55');sea.addColorStop(0.97,'#1a3b72');sea.addColorStop(1,'#4572b8');
    c.fillStyle=sea;c.beginPath();c.arc(cx,cy,R,0,Math.PI*2);c.fill();

    c.save();c.beginPath();c.arc(cx,cy,R,0,Math.PI*2);c.clip();
    var clusters=[];var nc=Math.round(Math.min(90,Math.max(34,w/14)));for(var i=0;i<nc;i++)clusters.push({x:rand()*w*1.1-w*0.05,y:top+Math.pow(rand(),1.5)*(h-top)*1.05,s:12+rand()*60,n:20+rand()*90|0});
    clusters.forEach(function(cl){
      var persp=Math.min(1,Math.max(0.25,(cl.y-top)/(h-top+1)));
      for(var j=0;j<cl.n;j++){
        var a=rand()*Math.PI*2,d=Math.pow(rand(),2)*cl.s;
        var x=cl.x+Math.cos(a)*d,y=cl.y+Math.sin(a)*d*persp*0.6;
        var b=rand(),sz=(0.4+b*1.1)*(0.5+persp*0.7);
        c.fillStyle=b>0.85?'rgba(255,240,205,.95)':'rgba(255,196,110,'+(0.35+b*0.5)+')';
        c.beginPath();c.arc(x,y,sz,0,Math.PI*2);c.fill();
      }
      var gl=c.createRadialGradient(cl.x,cl.y,0,cl.x,cl.y,cl.s*1.3);gl.addColorStop(0,'rgba(255,190,100,.16)');gl.addColorStop(1,'rgba(255,190,100,0)');
      c.fillStyle=gl;c.beginPath();c.arc(cl.x,cl.y,cl.s*1.3,0,Math.PI*2);c.fill();
    });
    var shade=c.createLinearGradient(0,top,0,top+(h-top)*0.35);shade.addColorStop(0,'rgba(60,100,170,.25)');shade.addColorStop(1,'rgba(10,20,40,0)');
    c.fillStyle=shade;c.fillRect(0,top,w,h-top);
    c.restore();

    c.lineWidth=2.5;c.strokeStyle='rgba(255,226,170,.85)';c.shadowColor='rgba(255,200,120,.9)';c.shadowBlur=18;
    c.beginPath();c.arc(cx,cy,R,Math.PI*1.02,Math.PI*1.98);c.stroke();
    c.lineWidth=1;c.strokeStyle='rgba(200,225,255,.6)';c.shadowBlur=6;c.beginPath();c.arc(cx,cy,R+1.5,Math.PI*1.02,Math.PI*1.98);c.stroke();
    c.shadowBlur=0;

    var hubs=[];for(var k=0;k<9;k++)hubs.push(clusters[(rand()*clusters.length)|0]);
    for(var m=0;m<hubs.length-1;m++){
      var p=hubs[m],q=hubs[m+1]; if(Math.abs(p.x-q.x)<w*0.12)continue;
      var mx=(p.x+q.x)/2,my=Math.min(p.y,q.y)-Math.abs(p.x-q.x)*0.35;
      var lg=c.createLinearGradient(p.x,p.y,q.x,q.y);lg.addColorStop(0,'rgba(255,214,150,.15)');lg.addColorStop(0.5,'rgba(255,214,150,.9)');lg.addColorStop(1,'rgba(255,214,150,.15)');
      c.strokeStyle=lg;c.lineWidth=1.2;c.shadowColor='rgba(255,190,110,.8)';c.shadowBlur=8;
      c.beginPath();c.moveTo(p.x,p.y);c.quadraticCurveTo(mx,my,q.x,q.y);c.stroke();
      [p,q].forEach(function(e){var g=c.createRadialGradient(e.x,e.y,0,e.x,e.y,10);g.addColorStop(0,'rgba(255,245,220,1)');g.addColorStop(0.25,'rgba(255,200,120,.7)');g.addColorStop(1,'rgba(255,200,120,0)');c.fillStyle=g;c.beginPath();c.arc(e.x,e.y,10,0,Math.PI*2);c.fill();});
    }
    c.shadowBlur=0;
  }
  function all(){document.querySelectorAll('canvas.globe-cv').forEach(draw)}
  var t;addEventListener('resize',function(){clearTimeout(t);t=setTimeout(all,120)});
  if(document.readyState!=='loading')all();else document.addEventListener('DOMContentLoaded',all);
})();
</script>
